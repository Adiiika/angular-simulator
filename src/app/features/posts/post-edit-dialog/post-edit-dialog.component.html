<form class="post-container-edit" [formGroup]="postForm" (ngSubmit)="onSubmit()">
    <h4>Введите новый title:</h4>
    <input class="update-input" type="text" formControlName="title">

    <h4>Введите новый tags:</h4>
    <input class="update-input" type="text" formControlName="tags">

    <h4>Введите новый views:</h4>
    <input class="update-input" type="number" formControlName="views">
    <button class="update-btn" type="submit">Обновить</button>
</form>
