<div class="post-create-container">
  <h1>Создание поста</h1>
  <form [formGroup]="postCreateForm" (ngSubmit)="onSubmit()">
    <div>
      <h2>Title</h2>
      <input id="post-title" formControlName="title" placeholder="Введите title" type="text" />
    </div>
    <div>
      <h2>Body</h2>
      <input id="post-body" formControlName="body" placeholder="Введите body" type="text" />
    </div>
    <div>
      <h2>Tags</h2>
      <input id="post-tags" formControlName="tags" placeholder="Введите tags" type="text" />
    </div>
    <div formGroupName="reactions">
      <h2>Reactions</h2>

      <span>Likes: &nbsp;</span>
      <input id="post-likes" formControlName="likes" placeholder="Введите likes" type="number" />

      <span>&nbsp;&nbsp; Dilikes: &nbsp;</span>
      <input
        id="post-dislikes"
        formControlName="dislikes"
        placeholder="Введите dislikes"
        type="number"
      />
    </div>
    <div>
      <h2>Views</h2>
      <input id="post-views" formControlName="views" placeholder="Введите views" type="number" />
    </div>
    <div>
      <h2>UserId</h2>
      <input id="post-userid" formControlName="userId" placeholder="Введите userId" type="number" />
    </div>

    <button id="create-form-btn" type="submit">Создать пост</button>
  </form>
</div>
