<div class="post-create-container">
  <h1>{{ 'postCreateSection.postCreateTitle' | translate }}</h1>
  <form [formGroup]="postCreateForm" (ngSubmit)="onSubmit()">
    <div>
      <h2>Title</h2>
      <input
        id="post-title"
        formControlName="title"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.title' | translate"
        type="text"
      />
    </div>
    <div>
      <h2>Body</h2>
      <input
        id="post-body"
        formControlName="body"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.body' | translate"
        type="text"
      />
    </div>
    <div>
      <h2>Tags</h2>
      <input
        id="post-tags"
        formControlName="tags"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.tags' | translate"
        type="text"
      />
    </div>
    <div formGroupName="reactions">
      <h2>Reactions</h2>
      <span>Likes: &nbsp;</span>
      <input
        id="post-likes"
        formControlName="likes"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.likes' | translate"
        type="number"
      />
      <span>&nbsp;&nbsp; Dilikes: &nbsp;</span>
      <input
        id="post-dislikes"
        formControlName="dislikes"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.dislikes' | translate"
        type="number"
      />
    </div>
    <div>
      <h2>Views</h2>
      <input
        id="post-views"
        formControlName="views"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.views' | translate"
        type="number"
      />
    </div>
    <div>
      <h2>UserId</h2>
      <input
        id="post-userid"
        formControlName="userId"
        [placeholder]="'postCreateSection.postCreatePlaceHolder.userId' | translate"
        type="number"
      />
    </div>

    <button id="create-form-btn" type="submit">
      {{ 'postCreateSection.postCreateTitle' | translate }}
    </button>
  </form>
</div>
