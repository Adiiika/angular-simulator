<div class="auth-container">
  <form [formGroup]="authform" (ngSubmit)="onSubmit()" class="augh-form">
    <h1 class="auth-user">{{ 'authSection.authUser' | translate }}</h1>
    <div class="auth-field">
      <h3>{{ 'authSection.authUsername' | translate }}</h3>
      <input id="auth-username" name="username" type="username" formControlName="username" alt="" />
    </div>
    <div class="auth-field">
      <h3>{{ 'authSection.authPassword' | translate }}</h3>
      <input id="auth-password" name="password" type="password" formControlName="password" alt="" />
    </div>
    <button id="auth-user-btn" type="submit">{{ 'button.authLogin' | translate }}</button>
  </form>
</div>
