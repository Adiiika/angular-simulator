<router-outlet />

<div class="container-user">
  <app-user-create (createUser)="userService.addUsers($event)" />
  <app-user-filter (filterUser)="onFilter($event)" />
  <h1 class="user-title">{{ 'userPageSection.userList' | translate }}</h1>
  <div class="user-list">
    @for (user of filteredUsers$ | async; track user.id) {
      <app-user-card [user]="user" (onDeleteUser)="userService.deleteUsers(user.id)" />
    } @empty {
      <div class="error-message fw-800 fs-26">{{ 'userPageSection.noUserList' | translate }}</div>
    }
  </div>
</div>
